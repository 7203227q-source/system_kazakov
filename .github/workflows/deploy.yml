name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Validate deploy secrets
        shell: bash
        run: |
          set -e
          missing=0
          if [ -z "${{ secrets.VPS_HOST }}" ]; then echo "::error::Missing secret VPS_HOST"; missing=1; fi
          if [ -z "${{ secrets.VPS_USER }}" ]; then echo "::error::Missing secret VPS_USER"; missing=1; fi
          if [ -z "${{ secrets.VPS_SSH_KEY }}" ] && [ -z "${{ secrets.VPS_SSH_KEY_B64 }}" ]; then
            echo "::error::Missing secret VPS_SSH_KEY (or VPS_SSH_KEY_B64)"
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then exit 1; fi

      - name: Prepare deploy key file
        shell: bash
        run: |
          set -e
          key_path="$GITHUB_WORKSPACE/.deploy_key"
          rm -f "$key_path"
          if [ -n "${{ secrets.VPS_SSH_KEY_B64 }}" ]; then
            printf '%s' "${{ secrets.VPS_SSH_KEY_B64 }}" | base64 -d > "$key_path"
          else
            printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" | tr -d '\r' | sed 's/^[[:space:]]*//' > "$key_path"
          fi
          chmod 644 "$key_path"
          ssh-keygen -lf "$key_path"

      - name: SSH connection test
        shell: bash
        run: |
          set -e
          ssh -v -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            -i "$GITHUB_WORKSPACE/.deploy_key" -p "${{ secrets.VPS_PORT || '22' }}" "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" "echo ssh_ok"

      - name: Execute deployment commands via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT || '22' }}
          username: ${{ secrets.VPS_USER }}
          key_path: /github/workspace/.deploy_key
          debug: true
          script_stop: true
          request_pty: true
          script: |
            set -e
            cd /var/www/system_kazakov

            git config --global --add safe.directory /var/www/system_kazakov || true
            git fetch --prune origin main
            git reset --hard origin/main
            git clean -fd

            source venv/bin/activate

            python -m pip install -r requirements.txt
            python manage.py migrate
            python manage.py collectstatic --noinput

            sudo -n systemctl restart examprep

      - name: Cleanup deploy key file
        if: always()
        shell: bash
        run: rm -f "$GITHUB_WORKSPACE/.deploy_key"
