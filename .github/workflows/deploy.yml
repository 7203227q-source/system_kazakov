name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Execute deployment commands via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT || '22' }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          fingerprint: ${{ secrets.VPS_FINGERPRINT }}
          debug: true
          script_stop: true
          script: |
            set -e
            cd /var/www/system_kazakov

            git config --global --add safe.directory /var/www/system_kazakov || true
            git fetch --prune origin main
            git reset --hard 0b37087
            git clean -fd

            source venv/bin/activate

            python -m pip install -r requirements.txt
            python manage.py collectstatic --noinput

            sudo -n systemctl restart examprep
