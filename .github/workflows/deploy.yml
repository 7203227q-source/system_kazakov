name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Validate deploy secrets
        shell: bash
        run: |
          set -e
          missing=0
          if [ -z "${{ secrets.VPS_HOST }}" ]; then echo "::error::Missing secret VPS_HOST"; missing=1; fi
          if [ -z "${{ secrets.VPS_USER }}" ]; then echo "::error::Missing secret VPS_USER"; missing=1; fi
          if [ -z "${{ secrets.VPS_SSH_KEY }}" ]; then echo "::error::Missing secret VPS_SSH_KEY"; missing=1; fi
          if [ "$missing" -ne 0 ]; then exit 1; fi

      - name: Show deploy key fingerprint
        shell: bash
        run: |
          set -e
          tmp="$(mktemp)"
          printf '%s' "${{ secrets.VPS_SSH_KEY }}" > "$tmp"
          chmod 600 "$tmp"
          ssh-keygen -lf "$tmp"
          rm -f "$tmp"

      - name: Execute deployment commands via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT || '22' }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          debug: true
          script_stop: true
          request_pty: true
          script: |
            set -e
            cd /var/www/system_kazakov

            git config --global --add safe.directory /var/www/system_kazakov || true
            git fetch --prune origin main
            git reset --hard origin/main
            git clean -fd

            source venv/bin/activate

            python -m pip install -r requirements.txt
            python manage.py migrate
            python manage.py collectstatic --noinput

            sudo -n systemctl restart examprep
