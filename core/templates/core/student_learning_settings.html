<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Настройки обучения</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    {% include 'core/includes/_ui_theme_css.html' %}
</head>
<body class="bg-gray-50 font-sans text-gray-800 h-[100dvh] flex overflow-hidden {% if user.role == 'student' %}{% if user.ui_theme == 'dark' %}ui-dark{% elif user.ui_theme == 'dark_classic' %}ui-dark-classic{% endif %}{% endif %}">
    {% include 'core/includes/_student_sidebar.html' with active_page='learning_settings' %}
    <main class="flex-1 flex flex-col h-[100dvh] overflow-y-auto">
        <header class="h-16 bg-white border-b border-gray-200 flex items-center justify-between px-4 md:px-8 shrink-0">
            <div class="flex items-center space-x-2 md:space-x-4">
                <button class="md:hidden text-gray-500 hover:text-gray-700 mr-2" onclick="toggleSidebar()">
                    <i class="fas fa-bars text-xl"></i>
                </button>
                <h1 class="text-lg md:text-xl font-bold text-gray-800 truncate">Настройки обучения</h1>
            </div>
        </header>

        <div class="p-4 md:p-8 max-w-5xl mx-auto w-full">
            <div class="bg-white rounded-xl shadow-sm p-6 border border-gray-100">
                <p class="text-gray-600">Здесь будут настройки предметов, экзамена и прогноза.</p>
            </div>
        </div>
    </main>
</body>
</html>
