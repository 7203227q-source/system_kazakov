{% load socialaccount %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Авторизация - Система Казакова</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#4F46E5',
                        secondary: '#10B981',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 font-sans text-gray-800 min-h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full bg-white rounded-2xl shadow-xl overflow-hidden">
        
        <!-- Header -->
        <div class="bg-primary px-8 py-10 text-center text-white relative overflow-hidden">
            <!-- Decorative circles -->
            <div class="absolute top-0 right-0 -mr-8 -mt-8 w-32 h-32 rounded-full bg-white opacity-10"></div>
            <div class="absolute bottom-0 left-0 -ml-8 -mb-8 w-24 h-24 rounded-full bg-white opacity-10"></div>
            
            <i class="fas fa-graduation-cap text-4xl mb-3"></i>
            <h1 class="text-3xl font-bold mb-1">Система Казакова</h1>
            <p class="text-indigo-100 text-sm">Умная подготовка к ЕГЭ и ОГЭ</p>
        </div>

        <!-- Tabs -->
        <div class="flex border-b border-gray-200">
            <a href="{% url 'login' %}" class="flex-1 text-center py-4 text-sm font-bold text-primary border-b-2 border-primary bg-white focus:outline-none">
                Вход
            </a>
            <a href="{% url 'register' %}" class="flex-1 text-center py-4 text-sm font-medium text-gray-500 hover:text-gray-700 bg-gray-50 hover:bg-gray-100 transition focus:outline-none">
                Регистрация
            </a>
        </div>

        <!-- Form Content -->
        <div class="p-8">
            <form action="#" method="POST" class="space-y-5">
                {% csrf_token %}
                
                <!-- Role Selection (Optional for Login, but good for demo) -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Я вхожу как:</label>
                    <div class="grid grid-cols-2 gap-3">
                        <label class="relative flex cursor-pointer rounded-lg border bg-indigo-50 border-primary p-3 shadow-sm focus:outline-none">
                            <input type="radio" name="role" value="student" class="sr-only" checked onchange="document.getElementById('email').value='student_ivan'; document.getElementById('password').value='1'">
                            <span class="flex flex-1 items-center justify-center">
                                <span class="flex flex-col items-center">
                                    <i class="fas fa-user-graduate text-primary text-xl mb-1"></i>
                                    <span class="block text-xs font-bold text-primary">Ученик</span>
                                </span>
                            </span>
                        </label>
                        <label class="relative flex cursor-pointer rounded-lg border bg-white border-gray-200 p-3 hover:bg-gray-50 focus:outline-none transition">
                            <input type="radio" name="role" value="tutor" class="sr-only" onchange="document.getElementById('email').value='tutor_maria'; document.getElementById('password').value='1'">
                            <span class="flex flex-1 items-center justify-center">
                                <span class="flex flex-col items-center">
                                    <i class="fas fa-chalkboard-teacher text-gray-400 text-xl mb-1"></i>
                                    <span class="block text-xs font-medium text-gray-600">Репетитор</span>
                                </span>
                            </span>
                        </label>
                        <label class="relative flex cursor-pointer rounded-lg border bg-white border-gray-200 p-3 hover:bg-gray-50 focus:outline-none transition">
                            <input type="radio" name="role" value="parent" class="sr-only" onchange="document.getElementById('email').value='parent_elena'; document.getElementById('password').value='1'">
                            <span class="flex flex-1 items-center justify-center">
                                <span class="flex flex-col items-center">
                                    <i class="fas fa-user-friends text-gray-400 text-xl mb-1"></i>
                                    <span class="block text-xs font-medium text-gray-600">Родитель</span>
                                </span>
                            </span>
                        </label>
                        <label class="relative flex cursor-pointer rounded-lg border bg-white border-gray-200 p-3 hover:bg-gray-50 focus:outline-none transition">
                            <input type="radio" name="role" value="admin" class="sr-only" onchange="document.getElementById('email').value='admin'; document.getElementById('password').value='123123'">
                            <span class="flex flex-1 items-center justify-center">
                                <span class="flex flex-col items-center">
                                    <i class="fas fa-shield-alt text-gray-400 text-xl mb-1"></i>
                                    <span class="block text-xs font-medium text-gray-600">Админ</span>
                                </span>
                            </span>
                        </label>
                    </div>
                </div>

                {% if error %}
                <div class="bg-red-50 border-l-4 border-red-500 p-4 mb-4">
                    <p class="text-sm text-red-700">{{ error }}</p>
                </div>
                {% endif %}

                <!-- Email Input -->
                <div>
                    <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Email или Логин</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <i class="fas fa-envelope text-gray-400"></i>
                        </div>
                        <input type="text" id="email" name="username" class="block w-full pl-10 pr-3 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-primary text-sm transition" placeholder="Логин или Email">
                    </div>
                </div>

                <!-- Password Input -->
                <div>
                    <div class="flex items-center justify-between mb-1">
                        <label for="password" class="block text-sm font-medium text-gray-700">Пароль</label>
                        <a href="#" class="text-xs font-medium text-primary hover:text-indigo-700">Забыли пароль?</a>
                    </div>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <i class="fas fa-lock text-gray-400"></i>
                        </div>
                        <input type="password" id="password" name="password" class="block w-full pl-10 pr-10 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-primary text-sm transition" placeholder="••••••••">
                        <button type="button" class="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-400 hover:text-gray-600">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>

                <!-- Remember Me -->
                <div class="flex items-center">
                    <input id="remember-me" type="checkbox" class="h-4 w-4 text-primary focus:ring-primary border-gray-300 rounded cursor-pointer">
                    <label for="remember-me" class="ml-2 block text-sm text-gray-700 cursor-pointer">
                        Запомнить меня
                    </label>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="w-full flex justify-center py-3 px-4 border border-transparent rounded-lg shadow-sm text-sm font-bold text-white bg-primary hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transition">
                    Войти в систему
                </button>
            </form>
            
            <!-- Social Login -->
            <div class="mt-6">
                <div class="relative">
                    <div class="absolute inset-0 flex items-center">
                        <div class="w-full border-t border-gray-200"></div>
                    </div>
                    <div class="relative flex justify-center text-sm">
                        <span class="px-2 bg-white text-gray-500">Или войти через</span>
                    </div>
                </div>

                <div class="mt-6 grid grid-cols-1 gap-3">
                    <a href="{% provider_login_url 'google' %}" class="w-full inline-flex justify-center py-2 px-4 border border-gray-300 rounded-lg shadow-sm bg-white text-sm font-medium text-gray-700 hover:bg-gray-50 transition">
                        <img src="https://upload.wikimedia.org/wikipedia/commons/archive/c/c1/20210618182605%21Google_%22G%22_logo.svg" class="h-5 w-5 mr-2" alt="Google">
                        Продолжить с Google
                    </a>
                </div>
            </div>
            
        </div>
    </div>

    <!-- Script to handle role selection (Visual only) -->
    <script>
        const radioInputs = document.querySelectorAll('input[name="role"]');
        
        radioInputs.forEach(input => {
            input.addEventListener('change', function() {
                // Reset all
                radioInputs.forEach(radio => {
                    const label = radio.closest('label');
                    const icon = label.querySelector('i');
                    const text = label.querySelector('span > span > span');
                    
                    label.classList.remove('border-primary', 'bg-indigo-50');
                    label.classList.add('border-gray-200', 'bg-white');
                    
                    icon.classList.remove('text-primary');
                    icon.classList.add('text-gray-400');
                    
                    text.classList.remove('font-bold', 'text-primary');
                    text.classList.add('font-medium', 'text-gray-600');
                });
                
                // Active state
                if(this.checked) {
                    const label = this.closest('label');
                    const icon = label.querySelector('i');
                    const text = label.querySelector('span > span > span');
                    
                    label.classList.remove('border-gray-200', 'bg-white');
                    label.classList.add('border-primary', 'bg-indigo-50');
                    
                    icon.classList.remove('text-gray-400');
                    icon.classList.add('text-primary');
                    
                    text.classList.remove('font-medium', 'text-gray-600');
                    text.classList.add('font-bold', 'text-primary');
                }
            });
        });
    </script>
{% include "core/image_modal.html" %}
</body>
</html>
