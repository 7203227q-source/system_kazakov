<!-- Mobile Overlay -->
<div id="mobile-sidebar-overlay" class="fixed inset-0 bg-gray-900 bg-opacity-50 z-40 hidden md:hidden transition-opacity" onclick="toggleSidebar()"></div>

<aside id="student-sidebar" class="w-64 bg-white border-r border-gray-200 flex flex-col shrink-0 h-full overflow-hidden fixed md:relative z-50 transform -translate-x-full md:translate-x-0 transition-transform duration-300">
    <div class="h-16 flex items-center justify-between px-6 border-b border-gray-200">
        <div class="flex items-center">
            <i class="fas fa-graduation-cap text-primary text-2xl mr-2"></i>
            <span class="text-xl font-bold text-gray-800">Система Казакова</span>
        </div>
        <button class="md:hidden text-gray-500 hover:text-gray-700" onclick="toggleSidebar()">
            <i class="fas fa-times text-xl"></i>
        </button>
    </div>
    <nav class="flex-1 px-4 py-6 space-y-2">
        <a href="{% url 'student_dashboard' %}" class="flex items-center px-4 py-3 {% if active_page == 'dashboard' %}bg-primary text-white{% else %}text-gray-600 hover:bg-gray-100{% endif %} rounded-lg transition">
            <i class="fas fa-home w-6"></i> Главная
        </a>
        <a href="{% url 'student_practice' %}" class="flex items-center px-4 py-3 {% if active_page == 'practice' %}bg-primary text-white{% else %}text-gray-600 hover:bg-gray-100{% endif %} rounded-lg transition">
            <i class="fas fa-dumbbell w-6"></i> Тренажер
        </a>
        <a href="{% url 'student_history' %}" class="flex items-center px-4 py-3 {% if active_page == 'history' %}bg-primary text-white{% else %}text-gray-600 hover:bg-gray-100{% endif %} rounded-lg transition">
            <i class="fas fa-history w-6"></i> Журнал решений
        </a>
        <a href="{% url 'chat_index' %}" class="flex items-center px-4 py-3 {% if active_page == 'chat' %}bg-primary text-white{% else %}text-gray-600 hover:bg-gray-100{% endif %} rounded-lg transition" id="sidebar-chat-link">
            <i class="fas fa-comments w-6"></i> Сообщения
            <span id="global-unread-badge" class="hidden ml-auto bg-red-100 text-red-600 py-0.5 px-2 rounded-full text-xs font-bold">0</span>
        </a>
    </nav>
    <div class="p-4 border-t border-gray-200">
        <form method="POST" action="{% url 'update_ui_theme' %}" class="mb-3">
            {% csrf_token %}
            <label class="block text-[10px] uppercase font-bold tracking-wider text-gray-500 mb-1">Тема интерфейса</label>
            <select name="ui_theme" onchange="this.form.submit()" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm bg-white">
                {% for code, name in user.UI_THEME_CHOICES %}
                    <option value="{{ code }}" {% if user.ui_theme == code %}selected{% endif %}>{{ name }}</option>
                {% endfor %}
            </select>
        </form>
        <div class="flex items-center">
            <img src="https://ui-avatars.com/api/?name={{ user.get_full_name|default:user.username|urlencode }}&background=E0E7FF&color=4F46E5" alt="User" class="w-10 h-10 rounded-full">
            <div class="ml-3">
                <p class="text-sm font-medium text-gray-800">{{ user.get_full_name|default:user.username }}</p>
                <p class="text-xs text-gray-500">Ученик {{ user.level }} уровня</p>
            </div>
        </div>
    </div>
</aside>

<script>
function toggleSidebar() {
    const sidebar = document.getElementById('student-sidebar');
    const overlay = document.getElementById('mobile-sidebar-overlay');
    
    if (sidebar.classList.contains('-translate-x-full')) {
        sidebar.classList.remove('-translate-x-full');
        if (overlay) overlay.classList.remove('hidden');
    } else {
        sidebar.classList.add('-translate-x-full');
        if (overlay) overlay.classList.add('hidden');
    }
}
</script>
