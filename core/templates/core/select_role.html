<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Выбор роли - ExamPrep</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script>
        tailwind.config = { theme: { extend: { colors: { primary: '#4F46E5', secondary: '#10B981', } } } }
    </script>
</head>
<body class="bg-gray-50 font-sans text-gray-800 min-h-screen flex items-center justify-center p-4">

    <div class="max-w-2xl w-full">
        <div class="text-center mb-10">
            <div class="w-20 h-20 bg-primary text-white rounded-full flex items-center justify-center text-4xl mx-auto mb-4 shadow-lg">
                <i class="fas fa-user-check"></i>
            </div>
            <h1 class="text-3xl font-bold text-gray-800 mb-2">Добро пожаловать, {{ user.first_name|default:user.username }}! 👋</h1>
            <p class="text-gray-500 text-lg">Похоже, вы зашли через социальную сеть. Выберите вашу роль на платформе, чтобы продолжить.</p>
        </div>

        <form method="POST" action="{% url 'select_role' %}" class="grid grid-cols-1 md:grid-cols-3 gap-6">
            {% csrf_token %}
            
            <!-- Ученик -->
            <label class="relative flex flex-col cursor-pointer rounded-2xl border-2 border-transparent bg-white p-6 shadow-sm hover:shadow-md hover:border-primary focus:outline-none transition group text-center">
                <input type="radio" name="role" value="student" class="sr-only" required>
                <div class="w-16 h-16 bg-indigo-50 text-primary rounded-full flex items-center justify-center text-3xl mx-auto mb-4 group-hover:scale-110 transition">
                    <i class="fas fa-user-graduate"></i>
                </div>
                <span class="block text-xl font-bold text-gray-800 mb-2">Я Ученик</span>
                <span class="block text-sm text-gray-500">Хочу решать тренажеры, готовиться к экзаменам и видеть свой прогресс.</span>
                <div class="absolute inset-0 border-2 border-primary rounded-2xl opacity-0 peer-checked:opacity-100 pointer-events-none transition"></div>
                <!-- Checkmark (shows when selected via some custom CSS or JS, here we just use basic radio) -->
            </label>

            <!-- Репетитор -->
            <label class="relative flex flex-col cursor-pointer rounded-2xl border-2 border-transparent bg-white p-6 shadow-sm hover:shadow-md hover:border-primary focus:outline-none transition group text-center">
                <input type="radio" name="role" value="tutor" class="sr-only" required>
                <div class="w-16 h-16 bg-indigo-50 text-gray-500 rounded-full flex items-center justify-center text-3xl mx-auto mb-4 group-hover:scale-110 group-hover:text-primary transition">
                    <i class="fas fa-chalkboard-teacher"></i>
                </div>
                <span class="block text-xl font-bold text-gray-800 mb-2">Я Репетитор</span>
                <span class="block text-sm text-gray-500">Хочу управлять учениками, выдавать домашние задания и отслеживать их успехи.</span>
            </label>

            <!-- Родитель -->
            <label class="relative flex flex-col cursor-pointer rounded-2xl border-2 border-transparent bg-white p-6 shadow-sm hover:shadow-md hover:border-primary focus:outline-none transition group text-center">
                <input type="radio" name="role" value="parent" class="sr-only" required>
                <div class="w-16 h-16 bg-indigo-50 text-gray-500 rounded-full flex items-center justify-center text-3xl mx-auto mb-4 group-hover:scale-110 group-hover:text-primary transition">
                    <i class="fas fa-user-friends"></i>
                </div>
                <span class="block text-xl font-bold text-gray-800 mb-2">Я Родитель</span>
                <span class="block text-sm text-gray-500">Хочу следить за успеваемостью ребенка и контролировать процесс обучения.</span>
            </label>

            <div class="col-span-1 md:col-span-3 mt-8">
                <button type="submit" class="w-full flex justify-center py-4 px-4 border border-transparent rounded-xl shadow-md text-lg font-bold text-white bg-primary hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transition">
                    Продолжить
                </button>
            </div>
        </form>
        
        <p class="text-center text-sm text-gray-400 mt-6">Роль можно будет изменить позже через службу поддержки.</p>
    </div>

</body>
</html>
